[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hanson-image-engine"
version = "0.1.0"
description = "Hanson Image Engine (HIE): computational photography research engine for smartphone RAW bursts."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Hanson Technologies" }]
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "opencv-python-headless>=4.8",
  "rawpy>=0.19",
  "tifffile>=2023.7",
  "imageio>=2.31",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "matplotlib>=3.7"]

[project.scripts]
hie = "hie_core.cli:main"

[tool.setuptools.packages.find]
include = ["hie_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "realdata: needs a downloaded Google HDR+ burst (skipped when absent)",
  "slow: long-running regression checks",
]
